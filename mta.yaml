_schema-version: "3.1"
ID: BookShopTyper
description: A simple BookShop application using typescript
version: 1.0.0
modules:
- name: BookShopTyper-srv
  type: nodejs
  path: gen/srv
  requires:
  - name: BookShopTyper-db
  - name: BookShopTyper-auth
  provides:
  - name: srv-api
    properties:
      srv-url: ${default-url}
  parameters:
    buildpack: nodejs_buildpack
  build-parameters:
    builder: npm
- name: BookShopTyper-db-deployer
  type: hdb
  path: gen/db
  requires:
  - name: BookShopTyper-db
    properties:
      TARGET_CONTAINER: ~{hdi-container-name}
  - name: cross-container-service-1
    group: SERVICE_REPLACEMENTS
    properties:
      key: ServiceName_1
      service: ~{the-service-name}
  parameters:
    buildpack: nodejs_buildpack
resources:
- name: BookShopTyper-db
  type: com.sap.xs.hdi-container
  parameters:
    service: hana
    service-plan: hdi-shared
  properties:
    hdi-container-name: ${service-name}
- name: BookShopTyper-auth
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      tenant-mode: dedicated
      xsappname: BookShopTyper
    path: ./xs-security.json
    service: xsuaa
    service-plan: application
- name: cross-container-service-1
  type: org.cloudfoundry.existing-service
  parameters:
    service-name: ups_bookstore
  properties:
    the-service-name: ${service-name}
parameters:
  enable-parallel-deployments: true
build-parameters:
  before-all:
  - builder: custom
    commands:
    - npx @cap-js/cds-typer "*" --outputDirectory @cds-models
    - npx cds build --production
    - npx @cap-js/cds-typer "*" --outputDirectory gen/srv/@cds-models
    - tsc
